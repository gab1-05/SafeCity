# SafeCity — Prometheus alert rules
# Covers the alert signals documented in docs/DEVOPS.md §6 Observability.
#
# Every series referenced here is emitted by GET /api/metrics/ (see
# backend/apps/core/metrics.py), except `up`, which Prometheus supplies for
# every scrape target. A backend test (tests/test_metrics.py) fails the build
# if a rule references a series the endpoint does not emit — rules and code
# cannot drift apart silently.

groups:
  - name: safecity-availability
    rules:
      # Backend scrape failing (process down or exposition broken)
      - alert: SafeCityBackendDown
        expr: up{job="safecity"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "SafeCity backend is unreachable"
          description: "Prometheus cannot scrape /api/metrics/ on the backend."

  - name: safecity-performance
    rules:
      # High 5xx error rate
      - alert: SafeCityHighErrorRate
        expr: |
          sum(rate(safecity_http_requests_total{status="5xx"}[5m]))
          /
          sum(rate(safecity_http_requests_total[5m])) > 0.01
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "SafeCity 5xx error rate above 1%"
          description: "Error rate has exceeded 1% of requests for 5 minutes."

      # Celery queue backlog growing
      - alert: SafeCityCeleryBacklog
        expr: safecity_celery_queue_depth > 100
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Celery queue backlog growing"
          description: "Redis celery queue depth above 100 for 15 minutes — check worker health."

  - name: safecity-business
    rules:
      # SLA breaches accumulating (open incidents past their deadline)
      - alert: SafeCitySlaBreachesAccumulating
        expr: delta(safecity_sla_breached_open[24h]) > 10
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "SLA breaches accumulating"
          description: "More than 10 net-new open SLA breaches in the last 24 hours — review department workload."

      # Auth failures spike
      - alert: SafeCityAuthFailureSpike
        expr: safecity_auth_failures_15m > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Auth failure spike"
          description: "More than 50 failed logins in 15 minutes — possible brute-force attempt."
