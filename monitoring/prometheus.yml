# SafeCity — Prometheus monitoring configuration
# Addressed DBIT Notice 3 monitoring requirements (F3-F5)
#
# Usage:
#   docker run -d --name prometheus -p 9090:9090 \
#     -v ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml \
#     prom/prometheus
#
# With Docker Compose: add the monitoring stack per monitoring/README.md

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: safecity

rule_files:
  - "alert-rules.yml"

scrape_configs:
  # SafeCity application metrics (Prometheus exposition format).
  # /api/health/ and /api/readiness/ are deliberately NOT scraped: they return
  # JSON for the kubelet/compose probes, and Prometheus needs text exposition.
  # Liveness/readiness stay where they belong (orchestrator probes); alerting
  # on availability uses the scape target's own `up` series below.
  - job_name: "safecity"
    metrics_path: /api/metrics/
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: "backend"
          environment: "development"

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]