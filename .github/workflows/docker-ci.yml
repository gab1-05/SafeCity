name: docker-ci

# Free: builds images, Trivy-scans them, pushes to GHCR (no ECR/AWS needed).
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"

env:
  REGISTRY: ghcr.io

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write
    strategy:
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Registry tags must be lowercase but github.repository ("gab1-05/SafeCity")
      # is not — a raw ghcr.io/${{ github.repository }}-... tag fails validation
      # in seconds. Lowercase it once here.
      - name: Lowercase image base
        run: echo "IMAGE_BASE=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.image }}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.image }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE_BASE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Trivy pulls the image by ref, so it can only run where the image was
      # pushed (push events). On PRs the image exists only in the builder.
      # Pin needs the "v" prefix (tags are vX.Y.Z). Avoids two failure modes
      # seen here: v0.2.0 bundles trivy 0.21 which cannot emit SARIF
      # ("unable to write results: unknown format: sarif"), and v0.28.x
      # references aquasecurity/setup-trivy@v0.2.1, a tag that no longer
      # exists ("Unable to resolve action"). v0.36.0 pins a valid
      # setup-trivy ref (v0.2.6 commit) and emits SARIF.
      - uses: aquasecurity/trivy-action@v0.36.0
        if: github.event_name == 'push'
        with:
          image-ref: ${{ env.IMAGE_BASE }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: CRITICAL,HIGH
          # Fail only on CVEs with a released fix; unfixed-upstream OS
          # findings cannot be cleared by any rebuild.
          ignore-unfixed: true
      # Keep the SARIF report as a build artifact so findings are reviewable.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: trivy-sarif-${{ matrix.image }}
          path: trivy-${{ matrix.image }}.sarif
          if-no-files-found: warn
