name: e2e

# Playwright smoke against a real seeded stack (Compose equivalent in CI).
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"

jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: safecity_test
          POSTGRES_USER: safecity
          POSTGRES_PASSWORD: safecity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U safecity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DB_HOST: localhost
      SECRET_KEY: ci-only-not-a-real-secret-000000000000000000000000
      VITE_API_BASE_URL: http://localhost:18081/api/v1
      VITE_WS_URL: ws://localhost:18081/ws/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend deps + seed
        working-directory: backend
        run: |
          pip install -r requirements/dev.txt
          python manage.py migrate
          python manage.py seed_demo_data
      - name: Start backend
        working-directory: backend
        run: nohup python manage.py runserver 127.0.0.1:18081 >/tmp/backend.log 2>&1 &
      - name: Build + preview frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          nohup npm run preview -- --port 5174 --host 127.0.0.1 >/tmp/frontend.log 2>&1 &
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install chromium --only-shell
      - name: Smoke tests
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:5174
          E2E_NO_SERVER: "1"
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
