{{- if .Values.serviceAccount.create -}}
{{- /*
  ServiceAccount for the backend, celery worker and celery-beat pods.

  On EKS this is the IRSA trust anchor: the role ARN goes in the annotation
  below, and the AWS SDK then obtains temporary credentials from the pod
  identity webhook. That is why no AWS keys are required in the Secret when
  the annotation is set.

    serviceAccount:
      annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::<account>:role/safecity-dev-irsa
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "safecity.serviceAccountName" . }}
  labels:
    {{- include "safecity.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
