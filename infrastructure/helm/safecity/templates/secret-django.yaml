{{- if and .Values.secret.create (not .Values.secret.existingSecret) -}}
{{- /*
  Secret TEMPLATE.

  This chart ships a template, not secret material. Two supported patterns:

    1. Supply values at deploy time from CI secrets:
         helm upgrade --install safecity ./infrastructure/helm/safecity \
           -f values-prod.yaml \
           --set secret.secretKey="$DJANGO_SECRET_KEY" \
           --set secret.postgresPassword="$POSTGRES_PASSWORD"

    2. Set secret.existingSecret to a Secret produced by External Secrets
       Operator / AWS Secrets Manager. In that case this template renders
       nothing and nothing here is required.

  `required` is used for values with no safe default so a misconfigured
  release fails at render time with a readable message rather than starting
  pods with an empty SECRET_KEY.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "safecity.secretName" . }}
  labels:
    {{- include "safecity.labels" . | nindent 4 }}
type: Opaque
stringData:
  secret-key: {{ required "secret.secretKey is required (or set secret.existingSecret)" .Values.secret.secretKey | quote }}
  postgres-password: {{ required "secret.postgresPassword is required (or set secret.existingSecret)" .Values.secret.postgresPassword | quote }}
  {{- with .Values.secret.emailHostUser }}
  email-host-user: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.emailHostPassword }}
  email-host-password: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.openaiApiKey }}
  openai-api-key: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.awsSecretAccessKey }}
  aws-secret-access-key: {{ . | quote }}
  {{- end }}
{{- end }}
