{{- if .Values.migration.enabled -}}
{{- /*
  Schema migration as a separate, observable step.

  The application never auto-migrates on pod start. Running migrations from a
  Deployment's entrypoint means N replicas all race the same migration, and a
  failed rollout becomes ambiguous: you cannot tell whether the old or the new
  schema is live.

  Annotations below make Helm run this BEFORE the release's Deployments are
  rolled (pre-install/pre-upgrade) and wait for it to finish, so a broken
  migration aborts the release instead of shipping a half-upgraded app.

  hook-delete-policy removes the finished Job so the next release can create a
  Job with the same name.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "safecity.fullname" . }}-migrate
  labels:
    {{- include "safecity.componentLabels" (dict "root" . "component" "migration") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    {{- with .Values.migration.hookAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  # Clean up the Job pod after a day so completed migrations do not accumulate.
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "safecity.componentSelectorLabels" (dict "root" . "component" "migration") | nindent 8 }}
      {{- with .Values.migration.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: Never
      # Dedicated ServiceAccount access is not needed to run migrations.
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.backend.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "safecity.image" (dict "root" . "image" .Values.backend.image) | quote }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["python", "manage.py", "migrate", "--noinput"]
          # Self-contained env (mirrors configmap.yaml + the two required
          # secret keys). This Job is a pre-install/pre-upgrade HOOK, so it
          # runs BEFORE the chart's ConfigMap/Secret exist — it must not
          # reference them via envFrom/secretKeyRef. Helm prunes hook-used
          # resources after the release, so hook-owned config would also
          # vanish under the Deployments.
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: {{ .Values.config.djangoSettingsModule | quote }}
            - name: DEBUG
              value: {{ .Values.config.debug | quote }}
            - name: ALLOWED_HOSTS
              value: {{ .Values.config.allowedHosts | quote }}
            - name: CSRF_TRUSTED_ORIGINS
              value: {{ .Values.config.csrfTrustedOrigins | quote }}
            - name: CORS_ALLOWED_ORIGINS
              value: {{ .Values.config.corsAllowedOrigins | quote }}
            - name: SECRET_KEY
              {{- if .Values.secret.existingSecret }}
              valueFrom:
                secretKeyRef:
                  # External Secrets must map these conventional key names.
                  name: {{ .Values.secret.existingSecret | quote }}
                  key: secret-key
              {{- else }}
              value: {{ required "secret.secretKey is required (or set secret.existingSecret)" .Values.secret.secretKey | quote }}
              {{- end }}
            - name: POSTGRES_DB
              value: {{ .Values.config.postgresDb | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.config.postgresUser | quote }}
            - name: POSTGRES_PASSWORD
              {{- if .Values.secret.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.existingSecret | quote }}
                  key: postgres-password
              {{- else }}
              value: {{ required "secret.postgresPassword is required (or set secret.existingSecret)" .Values.secret.postgresPassword | quote }}
              {{- end }}
            - name: DB_HOST
              value: {{ include "safecity.dbHost" . | quote }}
            - name: DB_PORT
              value: {{ .Values.config.dbPort | quote }}
            - name: DB_CONN_MAX_AGE
              value: {{ .Values.config.dbConnMaxAge | quote }}
            - name: REDIS_URL
              value: {{ include "safecity.redisUrl" . | quote }}
            - name: CELERY_BROKER_URL
              value: {{ include "safecity.celeryBrokerUrl" . | quote }}
            - name: CELERY_TASK_ALWAYS_EAGER
              value: {{ .Values.config.celeryTaskAlwaysEager | quote }}
            - name: MEDIA_BACKEND
              value: {{ .Values.config.mediaBackend | quote }}
            - name: AWS_S3_BUCKET
              value: {{ .Values.config.awsS3Bucket | quote }}
            - name: AWS_S3_REGION
              value: {{ .Values.config.awsS3Region | quote }}
            - name: S3_ENDPOINT_URL
              value: {{ .Values.config.s3EndpointUrl | quote }}
            - name: PUBLIC_URL
              value: {{ .Values.config.publicUrl | quote }}
            - name: ALLOW_ANONYMOUS_REPORTS
              value: {{ .Values.config.allowAnonymousReports | quote }}
            - name: EMERGENCY_MODE_ENABLED
              value: {{ .Values.config.emergencyModeEnabled | quote }}
            - name: PUBLIC_COORD_JITTER_METERS
              value: {{ .Values.config.publicCoordJitterMeters | quote }}
            - name: AI_PROVIDER
              value: {{ .Values.config.aiProvider | quote }}
            - name: AI_TRANSLATION_ENABLED
              value: {{ .Values.config.aiTranslationEnabled | quote }}
            - name: MALWARE_SCAN_PROVIDER
              value: {{ .Values.config.malwareScanProvider | quote }}
            - name: CAPTCHA_PROVIDER
              value: {{ .Values.config.captchaProvider | quote }}
            - name: RATE_LIMIT_ANON_PER_MIN
              value: {{ .Values.config.rateLimitAnonPerMin | quote }}
            - name: RATE_LIMIT_INCIDENTS_PER_HOUR
              value: {{ .Values.config.rateLimitIncidentsPerHour | quote }}
            - name: ACCESS_TOKEN_MINUTES
              value: {{ .Values.config.accessTokenMinutes | quote }}
            - name: REFRESH_TOKEN_DAYS
              value: {{ .Values.config.refreshTokenDays | quote }}
            - name: EMAIL_HOST
              value: {{ .Values.config.emailHost | quote }}
            - name: EMAIL_PORT
              value: {{ .Values.config.emailPort | quote }}
            - name: DEFAULT_FROM_EMAIL
              value: {{ .Values.config.defaultFromEmail | quote }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.backend.securityContext | nindent 12 }}
          volumeMounts:
            {{- include "safecity.tmpVolumeMount" . | nindent 12 }}
      volumes:
        {{- include "safecity.tmpVolume" . | nindent 8 }}
{{- end }}
