# ─────────────────────────────────────────────────────────────
# SafeCity — KIND overlay (FREE local Kubernetes, $0)
#
# Usage:
#   kind create cluster --name safecity
#   # in-cluster data services (chart needs dbHost/redisUrl):
#   helm repo add bitnami https://charts.bitnami.com/bitnami
#   helm install pg bitnami/postgresql \
#     --set auth.database=safecity,auth.username=safecity,auth.password=safecity
#   helm install redis bitnami/redis --set auth.enabled=false
#   helm upgrade --install safecity infrastructure/helm/safecity \
#     -f infrastructure/helm/safecity/values-kind.yaml \
#     -n safecity-dev --create-namespace \
#     --set secret.secretKey=dev-only-not-a-real-secret \
#     --set secret.postgresPassword=safecity
#
# Nothing here touches AWS. No EKS, RDS, ElastiCache, ALB or bill.
# ─────────────────────────────────────────────────────────────

global:
  environment: dev
  imageRegistry: ""

commonLabels:
  cost-center: safecity-kind

serviceAccount:
  create: true
  annotations: {}

config:
  djangoSettingsModule: config.settings.prod
  debug: "false"
  # kind kubelet probes + port-forwards reach pods by pod IP, so ALLOWED_HOSTS
  # must be permissive here (local demo only — never use "*" in staging/prod).
  allowedHosts: "localhost,127.0.0.1,safecity-backend,*"
  csrfTrustedOrigins: "http://localhost"
  corsAllowedOrigins: "http://localhost"

  # Bitnami in-cluster services (see install commands above).
  dbHost: "pg-postgresql.default.svc.cluster.local"
  dbPort: "5432"
  redisUrl: "redis://redis-master.default.svc.cluster.local:6379/0"

  mediaBackend: local
  awsS3Bucket: ""
  awsS3Region: ap-south-1
  publicUrl: "http://localhost"

  aiProvider: mock
  malwareScanProvider: mock
  captchaProvider: mock
  emailHost: ""
  celeryTaskAlwaysEager: "false"

backend:
  replicaCount: 1
  # kind has no TLS — prod settings default SECURE_SSL_REDIRECT=true, which
  # turns probe GETs into 301s and the pods never become Ready.
  extraEnv:
    - name: SECURE_SSL_REDIRECT
      value: "false"
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: false
  podDisruptionBudget:
    enabled: false

frontend:
  replicaCount: 1
  # kind has no Ingress — nginx must proxy /api + /ws to the backend Service.
  nginx:
    useClusterBackend: true
  # The default securityContext drops ALL caps (keeping only NET_BIND_SERVICE),
  # under which nginx-as-root cannot chown its cache dirs to uid 101 and
  # CrashLoops. Widen the add-list for local kind only; prod keeps the default.
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: false
    capabilities:
      drop:
        - ALL
      add:
        - NET_BIND_SERVICE
        - CHOWN
        - DAC_OVERRIDE
        - SETUID
        - SETGID
  resources:
    requests:
      cpu: 25m
      memory: 48Mi
    limits:
      cpu: 200m
      memory: 128Mi
  autoscaling:
    enabled: false
  podDisruptionBudget:
    enabled: false

celeryWorker:
  replicaCount: 1
  concurrency: 2
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

celeryBeat:
  replicaCount: 1
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

migration:
  enabled: true
  backoffLimit: 3

# No cloud LB on kind — use port-forward or the nginx ingress controller.
ingress:
  enabled: false

networkPolicy:
  enabled: false

# Supply at deploy time; never commit real secrets.
secret:
  create: true
  existingSecret: ""
