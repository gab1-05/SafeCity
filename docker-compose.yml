# SafeCity — development stack.
# Usage: docker compose up -d --build
#   then: docker compose exec backend python manage.py migrate
#         docker compose exec backend python manage.py seed_demo_data

x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: config.settings.dev
  SECRET_KEY: ${SECRET_KEY:-dev-only-key-change-me-in-production-0000}
  DEBUG: "true"
  ALLOWED_HOSTS: localhost,127.0.0.1,backend
  POSTGRES_DB: ${POSTGRES_DB:-safecity}
  POSTGRES_USER: ${POSTGRES_USER:-safecity}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-safecity}
  DB_HOST: db
  DB_PORT: "5432"
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  MEDIA_BACKEND: local
  ALLOW_ANONYMOUS_REPORTS: "true"
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  # Browser origins must match the actual host ports, or the SPA's requests
  # are CORS-blocked when BACKEND_PORT/FRONTEND_PORT are overridden.
  CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-5174},http://127.0.0.1:${FRONTEND_PORT:-5174},http://localhost:${BACKEND_PORT:-18081}
  CSRF_TRUSTED_ORIGINS: http://localhost:${FRONTEND_PORT:-5174}
  SEED_SUPERUSER_EMAIL: ${SEED_SUPERUSER_EMAIL:-admin@safecity.local}
  SEED_SUPERUSER_PASSWORD: ${SEED_SUPERUSER_PASSWORD:-Admin@12345!}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-safecity}
      POSTGRES_USER: ${POSTGRES_USER:-safecity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-safecity}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-safecity}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    # Optional local S3-compatible storage; backend defaults to local disk.

  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      <<: *backend-env
    volumes:
      - ./backend:/app
      - media_data:/app/media
    ports:
      # Must match the URL documented in README.md and the .env.example
      # VITE_API_BASE_URL, so the frontend reaches the API without edits.
      # Default host port is 18081 (overridable via BACKEND_PORT in .env).
      - "${BACKEND_PORT:-18081}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build: ./backend
    command: celery -A config worker -l info
    environment:
      <<: *backend-env
    volumes:
      - ./backend:/app
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Worker liveness: ping this container's own worker node. $$ escapes compose
    # interpolation so the shell expands $HOSTNAME (single quotes would not);
    # inspect ping exits non-zero when no node replies.
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$${HOSTNAME} -t 10 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s

  celery-beat:
    build: ./backend
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      <<: *backend-env
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Beat has no liveness endpoint; the image's HTTP check would always fail.
    healthcheck:
      disable: true

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    environment:
      # Must follow BACKEND_PORT, so the SPA reaches the API even when the
      # host port is overridden (e.g. 8080 taken by another service).
      VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-18081}/api/v1
      VITE_WS_URL: ws://localhost:${BACKEND_PORT:-18081}/ws/
      DOCKER: "true"
    volumes:
      - ./frontend:/app
    ports:
      # FRONTEND_PORT override lets you dodge a busy host port (e.g. 5174).
      - "${FRONTEND_PORT:-5174}:5174"
    depends_on:
      - backend

volumes:
  pgdata:
  minio_data:
  media_data:
