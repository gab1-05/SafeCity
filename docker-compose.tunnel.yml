# SafeCity — $0 public demo overlay (Cloudflare quick tunnel, ephemeral).
#
# Exposes the local compose stack on the public internet for demos/vivas at zero
# cost and without any cloud account. The tunnel URLs are random per run and die
# with the tunnel processes — this is a shop window, not production hosting.
#
# Usage (PowerShell):
#   1. Start the tunnels first and note the two https://*.trycloudflare.com URLs:
#        cloudflared tunnel --url http://127.0.0.1:18081   # backend  -> BACKEND_PUBLIC_HOST
#        cloudflared tunnel --url http://127.0.0.1:5176    # frontend -> FRONTEND_PUBLIC_HOST
#   2. Recreate the backend with the public hosts allowed:
#        $env:BACKEND_PUBLIC_HOST = "<backend>.trycloudflare.com"
#        $env:FRONTEND_PUBLIC_HOST = "<frontend>.trycloudflare.com"
#        docker compose -f docker-compose.yml -f docker-compose.tunnel.yml up -d backend
#   3. Serve a frontend build pointed at the public API (Vite bakes the URL in,
#      including the Content-Security-Policy — VITE_CSP_EXTRA is required):
#        cd frontend
#        $env:VITE_API_BASE_URL = "https://<backend>.trycloudflare.com/api/v1"
#        $env:VITE_WS_URL = "wss://<backend>.trycloudflare.com/ws/"
#        $env:VITE_CSP_EXTRA = "https://<backend>.trycloudflare.com wss://<backend>.trycloudflare.com"
#        npm run build
#        npm run preview -- --port 5176 --host 127.0.0.1
#
# Security: this publishes a DEBUG=true dev stack with default seed credentials.
# Demo data only, share the URL narrowly, and tear the tunnels down afterwards.
# For durable hosting see docs/COST-CONTROL.md (AWS single-instance notes).

services:
  backend:
    environment:
      ALLOWED_HOSTS: localhost,127.0.0.1,backend,${BACKEND_PUBLIC_HOST:?Set BACKEND_PUBLIC_HOST to the backend tunnel host},${FRONTEND_PUBLIC_HOST:?Set FRONTEND_PUBLIC_HOST to the frontend tunnel host}
      CORS_ALLOWED_ORIGINS: http://localhost:5174,http://127.0.0.1:5174,https://${FRONTEND_PUBLIC_HOST:?Set FRONTEND_PUBLIC_HOST to the frontend tunnel host}
      CSRF_TRUSTED_ORIGINS: http://localhost:5174,https://${FRONTEND_PUBLIC_HOST:?Set FRONTEND_PUBLIC_HOST to the frontend tunnel host}
