<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SafeCity — report civic incidents and track their resolution."
    />
    <!--
      %VITE_CSP_EXTRA% is replaced at build time with extra connect-src origins
      (e.g. "https://api.example.com wss://api.example.com"). Empty by default,
      so local/CI builds behave exactly as before. Any non-localhost deployment
      MUST set it, or the SPA cannot reach its own API (browser blocks the calls).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://accounts.google.com https://tile.openstreetmap.org; style-src 'self' 'unsafe-inline' https://accounts.google.com https://tile.openstreetmap.org; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' https://accounts.google.com https://tile.openstreetmap.org https://nominatim.openstreetmap.org http://localhost:18081 ws://localhost:18081 wss://localhost:18081 %VITE_CSP_EXTRA%; frame-src https://accounts.google.com; base-uri 'self'; form-action 'self';"
    />
    <title>SafeCity — Smart City Incident Management</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
