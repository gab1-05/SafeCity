# SafeCity backend lint configuration.
# RUF012 (mutable class attrs) is standard DRF style; B008 (arg defaults) is
# how DRF permission_classes work. E501 handled by formatter (line-length 100).
[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["RUF012", "B008", "E501", "SIM108", "SIM117", "UP038"]

[tool.ruff.lint.per-file-ignores]
# Settings modules intentionally use star imports from base.
"config/settings/*" = ["F403", "F405"]
# URL/routing configs import after django.setup() by design (models/ASGI).
"config/urls.py" = ["E402"]
"config/routing.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
